name: Deploy Prod

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
  ARTIFACTORY_PASS: ${{ secrets.ARTIFACTORY_PASSWORD }}
  ARTIFACTORY_EMAIL: ${{ secrets.ARTIFACTORY_EMAIL }}
  ARTIFACTORY_URL: https://geckorobotics.jfrog.io/artifactory/api/npm/npm/
  PROJECT_NAME: operations
  ENVIRONMENT: prod
  REGION: us-east1

jobs:
  deploy:
    name: Deploy to prod
    permissions:
      contents: "read"
      id-token: "write"

    runs-on: ubuntu-large
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set Release Version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Configure npm auth
        run: |
          ENCODED_PASS="$(printf '%s' "${ARTIFACTORY_PASS}" | base64 | tr -d '\n')"
          cat > "${HOME}/.npmrc" <<EOF
          registry=${ARTIFACTORY_URL}
          //geckorobotics.jfrog.io/artifactory/api/npm/npm/:username=${ARTIFACTORY_USER}
          //geckorobotics.jfrog.io/artifactory/api/npm/npm/:_password=${ENCODED_PASS}
          //geckorobotics.jfrog.io/artifactory/api/npm/npm/:email=${ARTIFACTORY_EMAIL}
          //geckorobotics.jfrog.io/artifactory/api/npm/npm/:always-auth=true
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        run: make tag-image

      - id: docker-push
        uses: geckorobotics/gecko-actions-custom-actions/docker-push@v0
        with:
          image_id: ${{ steps.build.outputs.IMAGE }}

      - id: cloud-run-deploy
        uses: geckorobotics/gecko-actions-custom-actions/cloud-run-deploy@v0
        with:
          image_id: ${{ steps.build.outputs.IMAGE }}
